version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # see https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/optimizing-pr-creation-version-updates#setting-up-a-cooldown-period-for-dependency-updates
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # @release-it-plugins/lerna-changelog only peers release-it ^17-19; there is
      # no release-it 20-compatible version yet, so a major bump breaks `npm ci`.
      - dependency-name: "release-it"
        update-types: ["version-update:semver-major"]
      # TypeScript and ESLint majors require deliberate migrations (tsconfig
      # deprecations, new lint rules) — adopt them in dedicated PRs, not a
      # grouped dev-dependency bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
